spring:
    application:
        name: config-server

    profiles:
        active: native

    cloud:
        config:
            server:
                native:
                    search-locations: file:////Users/ajha/Desktop/E-Comm Microservice/configserver/src/main/resources/config
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VIRTUAL_HOST:guest}
        connection-timeout: 30000
management:
    endpoints:
        web:
            exposure:
                include: "*"


server:
    port: 8888